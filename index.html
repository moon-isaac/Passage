<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Passage</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: default;
}

#viewer {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#image {
  display: block;
  max-width: 100vw;
  max-height: 100vh;
  width: auto;
  height: auto;
  object-fit: contain;
  pointer-events: none;
  opacity: 1;
  transition: opacity 180ms ease;
}

#image.fade {
  opacity: 0;
}

/* Navigation arrows */
.nav {
  position: fixed;
  z-index: 1000;
  width: 56px;
  height: 56px;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.82;
  -webkit-tap-highlight-color: transparent;
  pointer-events: auto;
}

.nav svg {
  width: 34px;
  height: 34px;
  display: block;
  fill: none;
  stroke: #fff;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.9));
}

/* Keep the controls slightly inside the viewport so mobile browser UI
   cannot swallow them. */
#left  { left: 10px; top: 50%; transform: translateY(-50%); }
#right { right: 10px; top: 50%; transform: translateY(-50%); }
#up    { left: 50%; top: 10px; transform: translateX(-50%); }
#down  { left: 50%; bottom: 10px; transform: translateX(-50%); }

.nav:hover,
.nav:active {
  opacity: 1;
}

@media (max-width: 600px) {
  .nav {
    width: 52px;
    height: 52px;
  }

  .nav svg {
    width: 31px;
    height: 31px;
    stroke-width: 1.8;
  }

  #left  { left: 6px; }
  #right { right: 6px; }
  #up    { top: 6px; }
  #down  { bottom: 6px; }
}
</style>
</head>

<body>

<div id="viewer">

  <img id="image" alt="">

  <button class="nav" id="left" aria-label="Previous image">
    <svg viewBox="0 0 40 40"><path d="M25 8 L13 20 L25 32"/></svg>
  </button>
  <button class="nav" id="right" aria-label="Next image">
    <svg viewBox="0 0 40 40"><path d="M15 8 L27 20 L15 32"/></svg>
  </button>
  <button class="nav" id="up" aria-label="Previous layer">
    <svg viewBox="0 0 40 40"><path d="M8 25 L20 13 L32 25"/></svg>
  </button>
  <button class="nav" id="down" aria-label="Next layer">
    <svg viewBox="0 0 40 40"><path d="M8 15 L20 27 L32 15"/></svg>
  </button>

</div>

<script>

const layers = {
  "A": [
    "A1.jpg",
    "A2.jpg",
    "A3.jpg",
    "A7.jpg",
    "A8.jpg",
    "A4.png",
    "A5.png",
    "A6.png"
  ],
  "B": [
    "B1.jpg",
    "B2.jpg",
    "B3.jpg",
    "B4.png",
    "B5.png"
  ],
  "C": [
    "C1.jpg",
    "C4.jpg",
    "C2.png",
    "C3.png",
    "C5.png",
    "C6.png"
  ],
  "D": [
    "D1.jpg",
    "D2.jpg",
    "D3.jpg",
    "D4.jpg",
    "D5.jpg",
    "D6.png",
    "D7.png",
    "D8.png",
    "D9.png",
    "D10.png"
  ],
  "E": [
    "E1.jpg",
    "E2.jpg",
    "E3.jpg",
    "E4.jpg",
    "E5.jpg"
  ],
  "F": [
    "F1.jpg",
    "F2.jpg",
    "F3.jpg",
    "F4.jpg",
    "F5.jpg",
    "F6.jpg"
  ],
  "G": [
    "G3.jpg",
    "G4.jpg",
    "G5.jpg",
    "G6.jpg",
    "G1.png",
    "G2.png"
  ],
  "H": [
    "H1.jpg",
    "H2.jpg",
    "H3.jpg",
    "H4.jpg",
    "H5.jpg",
    "H6.jpg",
    "H7.jpg"
  ]
};

const layerNames = Object.keys(layers);
let layerIndex = 0;

// Each layer has its own shuffled queue.
// A layer is exhausted only after every image in that layer has appeared once.
const queues = {};
const lastShown = {};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function refillQueue(layer) {
  let q = shuffle(layers[layer]);

  // Prevent the first image of a new cycle from being the same as
  // the last image of the previous cycle.
  if (q.length > 1 && q[0] === lastShown[layer]) {
    [q[0], q[1]] = [q[1], q[0]];
  }

  queues[layer] = q;
}

function nextHorizontalImage() {
  const layer = layerNames[layerIndex];

  if (!queues[layer] || queues[layer].length === 0) {
    refillQueue(layer);
  }

  const next = queues[layer].shift();
  lastShown[layer] = next;
  return next;
}

function currentLayer() {
  return layerNames[layerIndex];
}

function nextLayer(direction) {
  layerIndex = (layerIndex + direction + layerNames.length) % layerNames.length;

  const layer = currentLayer();

  // When entering a layer for the first time, initialize its queue.
  // If it was already visited, continue from where it left off.
  if (!queues[layer] || queues[layer].length === 0) {
    refillQueue(layer);
  }

  return queues[layer].shift();
}


function showImage(src) {
  image.style.opacity = "0";

  setTimeout(() => {
    image.src = src;
    image.onload = () => {
      image.style.opacity = "1";
    };
  }, 90);
}

function horizontalMove() {
  showImage(nextHorizontalImage());
}

function verticalMove(direction) {
  const layer = layerNames[layerIndex];
  const current = lastShown[layer];

  // Change layer first.
  layerIndex = (layerIndex + direction + layerNames.length) % layerNames.length;
  const newLayer = currentLayer();

  if (!queues[newLayer] || queues[newLayer].length === 0) {
    refillQueue(newLayer);
  }

  const next = queues[newLayer].shift();
  lastShown[newLayer] = next;
  showImage(next);
}

document.getElementById("left").addEventListener("click", horizontalMove);
document.getElementById("right").addEventListener("click", horizontalMove);

document.getElementById("up").addEventListener("click", () => verticalMove(-1));
document.getElementById("down").addEventListener("click", () => verticalMove(1));

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    horizontalMove();
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    verticalMove(-1);
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    verticalMove(1);
  }
});

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener("touchstart", e => {
  if (!e.touches.length) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener("touchend", e => {
  if (!e.changedTouches.length) return;

  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 35) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    horizontalMove();
  } else {
    verticalMove(dy < 0 ? 1 : -1);
  }
}, { passive: true });

// Start with the first image from A's shuffled cycle.
if (!queues[layerNames[layerIndex]]) {
  refillQueue(layerNames[layerIndex]);
}
showImage(queues[layerNames[layerIndex]].shift());
lastShown[layerNames[layerIndex]] = image.src;
showControls();



/* -------------------------
   Swipe
------------------------- */

let startX = 0;
let startY = 0;
let dragging = false;

const SWIPE_THRESHOLD = 45;
const DIRECTION_RATIO = 1.15;


function startPointer(x, y) {

  startX = x;
  startY = y;
  dragging = true;

}


function endPointer(x, y) {

  if (!dragging) return;

  dragging = false;

  const dx = x - startX;
  const dy = y - startY;

  const absX = Math.abs(dx);
  const absY = Math.abs(dy);

  if (Math.max(absX, absY) < SWIPE_THRESHOLD) {
    return;
  }


  /* Horizontal */

  if (absX > absY * DIRECTION_RATIO) {

    moveHorizontal();

  }

  /* Vertical */

  else if (absY > absX * DIRECTION_RATIO) {

    if (dy < 0) {
      // swipe up = next layer
      moveVertical(1);
    } else {
      // swipe down = previous layer
      moveVertical(-1);
    }

  }

}


/* Touch */

document.addEventListener(
  "touchstart",
  e => {

    if (e.touches.length !== 1) return;

    startPointer(
      e.touches[0].clientX,
      e.touches[0].clientY
    );

  },
  { passive: true }
);


document.addEventListener(
  "touchend",
  e => {

    if (e.changedTouches.length !== 1) return;

    endPointer(
      e.changedTouches[0].clientX,
      e.changedTouches[0].clientY
    );

  },
  { passive: true }
);


/* Mouse */

document.addEventListener(
  "mousedown",
  e => {
    startPointer(e.clientX, e.clientY);
  }
);


document.addEventListener(
  "mouseup",
  e => {
    endPointer(e.clientX, e.clientY);
  }
);


/* -------------------------
   Keyboard
------------------------- */

document.addEventListener(
  "keydown",
  e => {

    if (
      e.key === "ArrowLeft" ||
      e.key === "ArrowRight"
    ) {
      moveHorizontal();
    }

    else if (e.key === "ArrowUp") {
      moveVertical(-1);
    }

    else if (e.key === "ArrowDown") {
      moveVertical(1);
    }

  }
);


/* -------------------------
   Initial image
------------------------- */

const firstLayer = layers.A;

currentImage = randomItem(firstLayer);

image.src = currentImage;

showControls();

</script>

</body>
</html>
