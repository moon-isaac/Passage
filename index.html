<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Passage</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: default;
}

#viewer {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#image {
  display: block;
  max-width: 100vw;
  max-height: 100vh;
  width: auto;
  height: auto;
  object-fit: contain;
  pointer-events: none;
  opacity: 1;
  transition: opacity 180ms ease;
}

#image.fade {
  opacity: 0;
}

/* Navigation arrows */
.nav {
  position: absolute;
  z-index: 10;
  width: 52px;
  height: 52px;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  color: rgba(255,255,255,0.42);
  font-family: Arial, sans-serif;
  font-size: 34px;
  font-weight: 200;
  line-height: 52px;
  text-align: center;
  cursor: pointer;
  opacity: 0;
  transition:
    opacity 220ms ease,
    color 180ms ease;
  -webkit-tap-highlight-color: transparent;
}

.nav:hover {
  color: rgba(255,255,255,0.8);
}

#viewer.controls-visible .nav {
  opacity: 1;
}

#left  { left: 10px; top: 50%; transform: translateY(-50%); }
#right { right: 10px; top: 50%; transform: translateY(-50%); }
#up    { left: 50%; top: 8px; transform: translateX(-50%); }
#down  { left: 50%; bottom: 8px; transform: translateX(-50%); }

@media (max-width: 600px) {
  .nav {
    width: 48px;
    height: 48px;
    font-size: 30px;
    line-height: 48px;
  }

  #left  { left: 4px; }
  #right { right: 4px; }
  #up    { top: 4px; }
  #down  { bottom: 4px; }
}

@media (prefers-reduced-motion: reduce) {
  #image {
    transition: none;
  }

  .nav {
    transition: none;
  }
}
</style>
</head>

<body>

<div id="viewer">

  <img id="image" alt="">

  <button class="nav" id="left"  aria-label="Previous image">‹</button>
  <button class="nav" id="right" aria-label="Next image">›</button>
  <button class="nav" id="up"    aria-label="Previous layer">↑</button>
  <button class="nav" id="down"  aria-label="Next layer">↓</button>

</div>

<script>

const layers = {
  "A": ['A1.jpg', 'A2.jpg', 'A3.jpg', 'A4.png', 'A5.png', 'A6.png', 'A7.jpg', 'A8.jpg'],
  "B": ['B1.jpg', 'B2.jpg', 'B3.jpg', 'B4.png', 'B5.png'],
  "C": ['C1.jpg', 'C2.png', 'C3.png', 'C4.jpg', 'C5.png', 'C6.png'],
  "D": ['D1.jpg', 'D2.jpg', 'D3.jpg', 'D4.jpg', 'D5.jpg', 'D6.png', 'D7.png', 'D8.png', 'D9.png', 'D10.png'],
  "E": ['E1.jpg', 'E2.jpg', 'E3.jpg', 'E4.jpg', 'E5.jpg'],
  "F": ['F1.jpg', 'F2.jpg', 'F3.jpg', 'F4.jpg', 'F5.jpg', 'F6.jpg'],
  "G": ['G1.png', 'G2.png', 'G3.jpg', 'G4.jpg', 'G5.jpg', 'G6.jpg'],
  "H": ['H1.jpg', 'H2.jpg', 'H3.jpg', 'H4.jpg', 'H5.jpg', 'H6.jpg', 'H7.jpg']
};

const layerNames = Object.keys(layers);

let currentLayerIndex = 0;
let currentImage = null;

const viewer = document.getElementById("viewer");
const image = document.getElementById("image");

let hideControlsTimer = null;


/* -------------------------
   Image selection
------------------------- */

function randomItem(array) {

  if (array.length === 1) {
    return array[0];
  }

  let item;

  do {
    item = array[Math.floor(Math.random() * array.length)];
  }
  while (item === currentImage);

  return item;
}


function showImage(path) {

  if (path === currentImage) return;

  image.classList.add("fade");

  setTimeout(() => {

    image.onload = () => {
      image.classList.remove("fade");
    };

    image.src = path;
    currentImage = path;

  }, 90);
}


/* -------------------------
   Horizontal movement
   Same layer / random
------------------------- */

function moveHorizontal() {

  const layer = layerNames[currentLayerIndex];

  showImage(
    randomItem(layers[layer])
  );

}


/* -------------------------
   Vertical movement
   Sequential layers
------------------------- */

function moveVertical(direction) {

  currentLayerIndex =
    (currentLayerIndex + direction + layerNames.length)
    % layerNames.length;

  const layer = layerNames[currentLayerIndex];

  showImage(
    randomItem(layers[layer])
  );

}


/* -------------------------
   Navigation buttons
------------------------- */

document.getElementById("left").addEventListener(
  "click",
  () => moveHorizontal()
);

document.getElementById("right").addEventListener(
  "click",
  () => moveHorizontal()
);

document.getElementById("up").addEventListener(
  "click",
  () => moveVertical(-1)
);

document.getElementById("down").addEventListener(
  "click",
  () => moveVertical(1)
);


/* -------------------------
   Controls visibility
------------------------- */

function showControls() {

  viewer.classList.add("controls-visible");

  clearTimeout(hideControlsTimer);

  hideControlsTimer = setTimeout(() => {
    viewer.classList.remove("controls-visible");
  }, 1800);

}

document.addEventListener("mousemove", showControls);
document.addEventListener("touchstart", showControls, { passive: true });


/* -------------------------
   Swipe
------------------------- */

let startX = 0;
let startY = 0;
let dragging = false;

const SWIPE_THRESHOLD = 45;
const DIRECTION_RATIO = 1.15;


function startPointer(x, y) {

  startX = x;
  startY = y;
  dragging = true;

}


function endPointer(x, y) {

  if (!dragging) return;

  dragging = false;

  const dx = x - startX;
  const dy = y - startY;

  const absX = Math.abs(dx);
  const absY = Math.abs(dy);

  if (Math.max(absX, absY) < SWIPE_THRESHOLD) {
    return;
  }


  /* Horizontal */

  if (absX > absY * DIRECTION_RATIO) {

    moveHorizontal();

  }

  /* Vertical */

  else if (absY > absX * DIRECTION_RATIO) {

    if (dy < 0) {
      // swipe up = next layer
      moveVertical(1);
    } else {
      // swipe down = previous layer
      moveVertical(-1);
    }

  }

}


/* Touch */

document.addEventListener(
  "touchstart",
  e => {

    if (e.touches.length !== 1) return;

    startPointer(
      e.touches[0].clientX,
      e.touches[0].clientY
    );

  },
  { passive: true }
);


document.addEventListener(
  "touchend",
  e => {

    if (e.changedTouches.length !== 1) return;

    endPointer(
      e.changedTouches[0].clientX,
      e.changedTouches[0].clientY
    );

  },
  { passive: true }
);


/* Mouse */

document.addEventListener(
  "mousedown",
  e => {
    startPointer(e.clientX, e.clientY);
  }
);


document.addEventListener(
  "mouseup",
  e => {
    endPointer(e.clientX, e.clientY);
  }
);


/* -------------------------
   Keyboard
------------------------- */

document.addEventListener(
  "keydown",
  e => {

    if (
      e.key === "ArrowLeft" ||
      e.key === "ArrowRight"
    ) {
      moveHorizontal();
    }

    else if (e.key === "ArrowUp") {
      moveVertical(-1);
    }

    else if (e.key === "ArrowDown") {
      moveVertical(1);
    }

  }
);


/* -------------------------
   Initial image
------------------------- */

const firstLayer = layers.A;

currentImage = randomItem(firstLayer);

image.src = currentImage;

showControls();

</script>

</body>
</html>
