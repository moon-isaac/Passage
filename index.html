<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Passage</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #viewer {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #viewer img {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="viewer">
  <img id="image" src="" alt="">
</div>

<script>
/*
  Passage image viewer

  Folder structure:
    Passage/
      index.html
      images/
        A1.jpg
        A2.jpg
        ...
        H7.jpg

  Horizontal swipe:
    - stays within the current layer
    - randomly selects another image in that layer

  Vertical swipe:
    - moves through layers in order
    - A -> B -> C -> D -> E -> F -> G -> H
    - upward movement reverses the order

  The number after the letter is only an image identifier.
*/

const layers = {
  A: 8,
  B: 5,
  C: 6,
  D: 8,
  E: 5,
  F: 6,
  G: 6,
  H: 7
};

const layerNames = Object.keys(layers);
let currentLayerIndex = 0;
let currentImage = null;

function imagePath(layer, number) {
  // If your files are PNG rather than JPG, change .jpg below
  // or change the individual entries to include their extensions.
  return `images/${layer}${number}.jpg`;
}

// File extensions can differ. Add the actual extension here when needed.
const extensions = {
  A: {1:"jpg",2:"jpg",3:"jpg",4:"png",5:"png",6:"png",7:"jpg",8:"jpg"},
  B: {1:"jpg",2:"jpg",3:"jpg",4:"png",5:"png"},
  C: {1:"jpg",2:"png",3:"png",4:"jpg",5:"png",6:"png"},
  D: {1:"jpg",2:"jpg",3:"jpg",4:"jpg",5:"jpg",6:"jpg",7:"jpg",8:"jpg"},
  E: {1:"jpg",2:"jpg",3:"jpg",4:"jpg",5:"jpg"},
  F: {1:"jpg",2:"jpg",3:"jpg",4:"jpg",5:"jpg",6:"jpg"},
  G: {1:"jpg",2:"jpg",3:"jpg",4:"jpg",5:"jpg",6:"jpg"},
  H: {1:"jpg",2:"jpg",3:"jpg",4:"jpg",5:"jpg",6:"jpg",7:"jpg"}
};

function getPath(layer, number) {
  const ext = extensions[layer]?.[number] || "jpg";
  return `images/${layer}${number}.${ext}`;
}

function randomImageInLayer(layer) {
  const count = layers[layer];
  if (count <= 1) return 1;

  let n;
  do {
    n = Math.floor(Math.random() * count) + 1;
  } while (currentImage === `${layer}${n}`);

  return n;
}

function showImage(layer, number) {
  currentLayerIndex = layerNames.indexOf(layer);
  currentImage = `${layer}${number}`;

  const img = document.getElementById("image");
  img.src = getPath(layer, number);
}

function showRandomCurrentLayer() {
  const layer = layerNames[currentLayerIndex];
  showImage(layer, randomImageInLayer(layer));
}

function moveLayer(direction) {
  const nextIndex =
    (currentLayerIndex + direction + layerNames.length) %
    layerNames.length;

  const nextLayer = layerNames[nextIndex];
  const number = randomImageInLayer(nextLayer);

  showImage(nextLayer, number);
}

// Start with a random image from layer A.
showImage("A", Math.floor(Math.random() * layers.A) + 1);

let startX = 0;
let startY = 0;
let startTime = 0;

const SWIPE_THRESHOLD = 45;
const DIRECTION_RATIO = 1.15;

function pointerStart(x, y) {
  startX = x;
  startY = y;
  startTime = Date.now();
}

function pointerEnd(x, y) {
  const dx = x - startX;
  const dy = y - startY;
  const absX = Math.abs(dx);
  const absY = Math.abs(dy);

  if (Math.max(absX, absY) < SWIPE_THRESHOLD) return;

  if (absX > absY * DIRECTION_RATIO) {
    // Horizontal: random image within same layer.
    showRandomCurrentLayer();
  } else if (absY > absX * DIRECTION_RATIO) {
    // Vertical: sequential layer movement.
    // Swipe up = next layer, swipe down = previous layer.
    moveLayer(dy < 0 ? 1 : -1);
  }
}

document.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) return;
  pointerStart(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: true});

document.addEventListener("touchend", e => {
  if (e.changedTouches.length !== 1) return;
  pointerEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
}, {passive: true});

// Mouse / trackpad drag support.
let mouseDown = false;

document.addEventListener("mousedown", e => {
  mouseDown = true;
  pointerStart(e.clientX, e.clientY);
});

document.addEventListener("mouseup", e => {
  if (!mouseDown) return;
  mouseDown = false;
  pointerEnd(e.clientX, e.clientY);
});

// Keyboard support for desktop testing.
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    showRandomCurrentLayer();
  } else if (e.key === "ArrowUp") {
    moveLayer(1);
  } else if (e.key === "ArrowDown") {
    moveLayer(-1);
  }
});
</script>

</body>
</html>
