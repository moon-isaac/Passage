<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Passage</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#photo{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain;transform-origin:center;will-change:transform;pointer-events:none}
.arrow{position:fixed;z-index:1000;width:56px;height:56px;padding:0;border:0;background:transparent;color:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.arrow:active{color:#fff}.arrow svg{width:28px;height:28px}
#left{left:6px;top:50%;transform:translateY(-50%)}#right{right:6px;top:50%;transform:translateY(-50%)}
#up{top:6px;left:50%;transform:translateX(-50%)}#down{bottom:6px;left:50%;transform:translateX(-50%)}
#elevation{position:fixed;z-index:1001;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));font:400 13px/1 Arial,Helvetica,sans-serif;color:rgba(255,255,255,.72);text-shadow:0 1px 3px rgba(0,0,0,.75);pointer-events:none}
@media(max-width:600px){.arrow{width:52px;height:52px}.arrow svg{width:25px;height:25px}#left{left:6px}#right{right:6px}#up{top:max(6px,env(safe-area-inset-top))}#down{bottom:max(6px,env(safe-area-inset-bottom))}}
</style></head><body>
<div id="stage"><img id="photo" alt=""></div><div id="elevation"></div>
<button class="arrow" id="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35"><path d="M15 4 7 12l8 8"/></svg></button>
<button class="arrow" id="right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35"><path d="m9 4 8 8-8 8"/></svg></button>
<button class="arrow" id="up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35"><path d="m4 15 8-8 8 8"/></svg></button>
<button class="arrow" id="down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35"><path d="m4 9 8 8-8 8"/></svg></button>
<script>
const layers={"A": {"elev": "564 m", "files": ["A1.jpg", "A2.jpg", "A3.jpg", "A4.png", "A5.png", "A6.png", "A7.jpg", "A8.jpg"]}, "B": {"elev": "49 m", "files": ["B1.jpg", "B2.jpg", "B3.jpg", "B4.png", "B5.png"]}, "C": {"elev": "29 m", "files": ["C1.jpg", "C2.png", "C3.png", "C4.jpg", "C5.png", "C6.png"]}, "D": {"elev": "28 m", "files": ["D1.jpg", "D2.jpg", "D3.jpg", "D4.jpg", "D5.jpg", "D6.png", "D7.png", "D8.png", "D9.png", "D10.png"]}, "E": {"elev": "4 m", "files": ["E1.jpg", "E2.jpg", "E3.jpg", "E4.jpg", "E5.jpg"]}, "F": {"elev": "1 m", "files": ["F1.jpg", "F2.jpg", "F3.jpg", "F4.jpg", "F5.jpg", "F6.jpg"]}, "G": {"elev": "31 m", "files": ["G1.png", "G2.png", "G3.jpg", "G4.jpg", "G5.jpg", "G6.jpg"]}, "H": {"elev": "-0.05 m", "files": ["H1.jpg", "H2.jpg", "H3.jpg", "H4.jpg", "H5.jpg", "H6.jpg", "H7.jpg", "H8.jpg", "H9.jpg"]}},order=["A", "B", "G", "C", "D", "E", "F", "H"],queues={},positions={};
let layerIndex=0,currentFile=null,scale=1,panX=0,panY=0,baseW=0,baseH=0;
const photo=document.getElementById('photo'),elevation=document.getElementById('elevation');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextFromLayer(k){if(!queues[k]||positions[k]>=queues[k].length){let q=shuffle(layers[k].files);if(q.length>1&&q[0]===currentFile)[q[0],q[1]]=[q[1],q[0]];queues[k]=q;positions[k]=0}return queues[k][positions[k]++]}
function apply(){photo.style.transform=`translate3d(${panX}px,${panY}px,0) scale(${scale})`}
function reset(){scale=1;panX=0;panY=0;apply()}
function measure(){let r=photo.getBoundingClientRect();baseW=r.width/scale;baseH=r.height/scale}
function clamp(){let mx=Math.max(0,(baseW*scale-innerWidth)/2),my=Math.max(0,(baseH*scale-innerHeight)/2);panX=Math.max(-mx,Math.min(mx,panX));panY=Math.max(-my,Math.min(my,panY))}
function load(f){currentFile=f;reset();photo.onload=()=>{measure();reset()};photo.src=f;elevation.textContent=layers[order[layerIndex]].elev}
function horiz(dir){let k=order[layerIndex];if(dir>0)load(nextFromLayer(k));else{let a=layers[k].files.filter(f=>f!==currentFile);load(a[Math.floor(Math.random()*a.length)]||layers[k].files[0])}}
function vert(dir){layerIndex=(layerIndex+dir+order.length)%order.length;load(nextFromLayer(order[layerIndex]))}
left.onclick=()=>horiz(-1);right.onclick=()=>horiz(1);up.onclick=()=>vert(-1);down.onclick=()=>vert(1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')horiz(-1);else if(e.key==='ArrowRight')horiz(1);else if(e.key==='ArrowUp')vert(-1);else if(e.key==='ArrowDown')vert(1)});

let touches=new Map(),pinchDistance=0,pinchStartScale=1,lastX=0,lastY=0;
function distance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
document.addEventListener('touchstart',e=>{
 for(const t of e.changedTouches)touches.set(t.identifier,t);
 if(touches.size===2){const [a,b]=[...touches.values()];pinchDistance=distance(a,b);pinchStartScale=scale}
 else if(touches.size===1&&scale>1){const t=[...touches.values()][0];lastX=t.clientX;lastY=t.clientY}
},{passive:false});
document.addEventListener('touchmove',e=>{
 for(const t of e.changedTouches)touches.set(t.identifier,t);
 if(touches.size===2){e.preventDefault();const [a,b]=[...touches.values()],d=distance(a,b);if(pinchDistance)scale=Math.max(1,Math.min(2,pinchStartScale*d/pinchDistance));clamp();apply()}
 else if(touches.size===1&&scale>1){e.preventDefault();const t=[...touches.values()][0];panX+=t.clientX-lastX;panY+=t.clientY-lastY;lastX=t.clientX;lastY=t.clientY;clamp();apply()}
},{passive:false});
document.addEventListener('touchend',e=>{for(const t of e.changedTouches)touches.delete(t.identifier);if(touches.size<2)pinchDistance=0},{passive:false});
document.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)touches.delete(t.identifier);if(touches.size<2)pinchDistance=0},{passive:false});

addEventListener('resize',()=>{measure();clamp();apply()});
load(nextFromLayer(order[layerIndex]));
</script></body></html>
