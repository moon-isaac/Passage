<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Passage</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#viewer {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#viewer img {
  display: block;
  max-width: 100vw;
  max-height: 100vh;
  width: auto;
  height: auto;
  object-fit: contain;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="viewer">
  <img id="image" alt="">
</div>

<script>

/*
  Passage

  이미지 파일은 index.html과 같은 위치에 있습니다.

  가로 이동:
  현재 층위 안에서 다른 이미지를 랜덤하게 보여줍니다.

  세로 이동:
  A → B → C → D → E → F → G → H

  아래로 움직이면 반대 방향입니다.
*/


const layers = {

  A: [
    "A1.jpg",
    "A2.jpg",
    "A3.jpg",
    "A4.png",
    "A5.png",
    "A6.png",
    "A7.jpg",
    "A8.jpg"
  ],

  B: [
    "B1.jpg",
    "B2.jpg",
    "B3.jpg",
    "B4.png",
    "B5.png"
  ],

  C: [
    "C1.jpg",
    "C2.png",
    "C3.png",
    "C4.jpg",
    "C5.png",
    "C6.png"
  ],

  D: [
    "D1.jpg",
    "D2.jpg",
    "D3.jpg",
    "D4.jpg",
    "D5.jpg",
    "D6.png",
    "D7.png",
    "D8.png",
    "D9.png",
    "D10.png"
  ],

  E: [
    "E1.jpg",
    "E2.jpg",
    "E3.jpg",
    "E4.jpg",
    "E5.jpg"
  ],

  F: [
    "F1.jpg",
    "F2.jpg",
    "F3.jpg",
    "F4.jpg",
    "F5.jpg",
    "F6.jpg"
  ],

  G: [
    "G1.png",
    "G2.png",
    "G3.jpg",
    "G4.jpg",
    "G5.jpg",
    "G6.jpg"
  ],

  H: [
    "H1.jpg",
    "H2.jpg",
    "H3.jpg",
    "H4.jpg",
    "H5.jpg",
    "H6.jpg",
    "H7.jpg"
  ]

};


const layerNames = Object.keys(layers);

let currentLayerIndex = 0;
let currentImage = null;

const image = document.getElementById("image");


function randomItem(array) {

  if (array.length === 1) {
    return array[0];
  }

  let item;

  do {
    item = array[Math.floor(Math.random() * array.length)];
  }

  while (item === currentImage);

  return item;
}


function showImage(path) {

  currentImage = path;

  image.src = path;
}


function showRandomImageInCurrentLayer() {

  const layer = layerNames[currentLayerIndex];

  showImage(
    randomItem(layers[layer])
  );

}


function moveLayer(direction) {

  currentLayerIndex =
    (currentLayerIndex + direction + layerNames.length)
    % layerNames.length;

  const layer = layerNames[currentLayerIndex];

  showImage(
    randomItem(layers[layer])
  );

}


/* 처음에는 A층의 이미지 중 하나 */

showImage(
  randomItem(layers.A)
);


/* -------------------------
   터치 / 스와이프
------------------------- */

let startX = 0;
let startY = 0;
let dragging = false;

const SWIPE_THRESHOLD = 45;
const DIRECTION_RATIO = 1.15;


function startPointer(x, y) {

  startX = x;
  startY = y;

  dragging = true;

}


function endPointer(x, y) {

  if (!dragging) {
    return;
  }

  dragging = false;

  const dx = x - startX;
  const dy = y - startY;

  const absX = Math.abs(dx);
  const absY = Math.abs(dy);


  if (Math.max(absX, absY) < SWIPE_THRESHOLD) {
    return;
  }


  /* 가로 이동 */

  if (absX > absY * DIRECTION_RATIO) {

    showRandomImageInCurrentLayer();

  }


  /* 세로 이동 */

  else if (absY > absX * DIRECTION_RATIO) {

    /*
      위로 스와이프:
      A → B → C → D ...

      아래로 스와이프:
      H → G → F → E ...
    */

    if (dy < 0) {

      moveLayer(1);

    } else {

      moveLayer(-1);

    }

  }

}


/* 모바일 */

document.addEventListener(
  "touchstart",
  function(e) {

    if (e.touches.length !== 1) {
      return;
    }

    startPointer(
      e.touches[0].clientX,
      e.touches[0].clientY
    );

  },
  { passive: true }
);


document.addEventListener(
  "touchend",
  function(e) {

    if (e.changedTouches.length !== 1) {
      return;
    }

    endPointer(
      e.changedTouches[0].clientX,
      e.changedTouches[0].clientY
    );

  },
  { passive: true }
);


/* 마우스 */

document.addEventListener(
  "mousedown",
  function(e) {

    startPointer(
      e.clientX,
      e.clientY
    );

  }
);


document.addEventListener(
  "mouseup",
  function(e) {

    endPointer(
      e.clientX,
      e.clientY
    );

  }
);


/* 키보드 테스트 */

document.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "ArrowLeft" ||
      e.key === "ArrowRight"
    ) {

      showRandomImageInCurrentLayer();

    }

    else if (e.key === "ArrowUp") {

      moveLayer(1);

    }

    else if (e.key === "ArrowDown") {

      moveLayer(-1);

    }

  }
);

</script>

</body>
</html>
