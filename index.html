<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Passage</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{user-select:none;-webkit-user-select:none}
#stage{touch-action:none;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#photo{touch-action:none;display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain;transform-origin:center;will-change:transform;pointer-events:auto}
.arrow{position:fixed;z-index:1000;width:56px;height:56px;padding:0;border:0;background:transparent;color:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))}
.arrow:active{color:#fff}.arrow svg{width:28px;height:28px}
#left{left:6px;top:50%;transform:translateY(-50%)}#right{right:6px;top:50%;transform:translateY(-50%)}
#up{top:6px;left:50%;transform:translateX(-50%)}#down{bottom:6px;left:50%;transform:translateX(-50%)}
#worktitle{position:fixed;z-index:1001;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));font:400 13px/1 Arial,Helvetica,sans-serif;color:rgba(255,255,255,.72);text-shadow:0 1px 3px rgba(0,0,0,.75);pointer-events:none}
#elevation{position:fixed;z-index:1001;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));font:400 13px/1 Arial,Helvetica,sans-serif;color:rgba(255,255,255,.72);text-shadow:0 1px 3px rgba(0,0,0,.75);pointer-events:auto}
@media(max-width:600px){.arrow{width:52px;height:52px}.arrow svg{width:25px;height:25px}#left{left:6px}#right{right:6px}#up{top:max(6px,env(safe-area-inset-top))}#down{bottom:max(6px,env(safe-area-inset-bottom))}}
</style></head><body>
<div id="stage"><img id="photo" alt=""></div><div id="elevation"></div><div id="worktitle">Passage</div>
<button class="arrow" id="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg></button>
<button class="arrow" id="right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg></button>
<button class="arrow" id="up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="m4 15 8-8 8 8"/></svg></button>
<button class="arrow" id="down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="m4 9 8 8 8-8"/></svg></button>
<script>
const layers={"A": {"elev": "564 m", "files": ["A1.jpg", "A2.jpg", "A3.jpg", "A4.png", "A5.png", "A6.png", "A7.jpg", "A8.jpg"]}, "B": {"elev": "49 m", "files": ["B1.jpg", "B2.jpg", "B3.jpg", "B4.png", "B5.png"]}, "C": {"elev": "29 m", "files": ["C1.jpg", "C2.png", "C3.png", "C4.jpg", "C5.png", "C6.png"]}, "D": {"elev": "28 m", "files": ["D1.jpg", "D2.jpg", "D3.jpg", "D4.jpg", "D5.jpg", "D6.png", "D7.png", "D8.png", "D9.png", "D10.png", "D11.jpg", "D12.jpg", "D13.jpg", "D14.jpg"]}, "E": {"elev": "4 m", "files": ["E1.jpg", "E2.jpg", "E3.jpg", "E4.jpg", "E5.jpg"]}, "F": {"elev": "1 m", "files": ["F1.jpg", "F2.jpg", "F3.jpg", "F4.jpg", "F5.jpg", "F6.jpg"]}, "G": {"elev": "31 m", "files": ["G1.png", "G2.png", "G3.jpg", "G4.jpg", "G5.jpg", "G6.jpg"]}, "H": {"elev": "-0.05 m", "files": ["H1.jpg", "H2.jpg", "H3.jpg", "H4.jpg", "H5.jpg", "H6.jpg", "H7.jpg", "H8.jpg", "H9.jpg"]}},order=["A", "B", "G", "C", "D", "E", "F", "H"],queues={},positions={};
let layerIndex=0,currentFile=null,scale=1,panX=0,panY=0,baseW=0,baseH=0;
const photo=document.getElementById('photo'),elevation=document.getElementById('elevation'),stage=document.getElementById('stage');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextFromLayer(k){if(!queues[k]||positions[k]>=queues[k].length){let q=shuffle(layers[k].files);if(q.length>1&&q[0]===currentFile)[q[0],q[1]]=[q[1],q[0]];queues[k]=q;positions[k]=0}return queues[k][positions[k]++]}
function apply(){photo.style.transform=`translate3d(${panX}px,${panY}px,0) scale(${scale})`}
function reset(){scale=1;panX=0;panY=0;apply()}
function measure(){let r=photo.getBoundingClientRect();baseW=r.width/scale;baseH=r.height/scale}
function clamp(){let mx=Math.max(0,(baseW*scale-innerWidth)/2),my=Math.max(0,(baseH*scale-innerHeight)/2);panX=Math.max(-mx,Math.min(mx,panX));panY=Math.max(-my,Math.min(my,panY))}
function load(f){currentFile=f;reset();photo.onload=()=>{measure();reset()};photo.src=f;elevation.textContent=layers[order[layerIndex]].elev}
function horiz(dir){let k=order[layerIndex];if(dir>0)load(nextFromLayer(k));else{let a=layers[k].files.filter(f=>f!==currentFile);load(a[Math.floor(Math.random()*a.length)]||layers[k].files[0])}}
function vert(dir){layerIndex=(layerIndex+dir+order.length)%order.length;load(nextFromLayer(order[layerIndex]))}
left.onclick=()=>horiz(-1);right.onclick=()=>horiz(1);up.onclick=()=>vert(-1);down.onclick=()=>vert(1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')horiz(-1);else if(e.key==='ArrowRight')horiz(1);else if(e.key==='ArrowUp')vert(-1);else if(e.key==='ArrowDown')vert(1)});

// Touch handling: separate mobile touch gestures from desktop mouse handling.
const pointers=new Map();
let gestureMode='none', startX=0,startY=0,startTime=0,lastX=0,lastY=0;
let pinchStartDist=0,pinchStartScale=1,pinchMidX=0,pinchMidY=0;
let touchWasPinch=false;

function touchDist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
function touchMid(a,b){return {x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}

function touchStart(e){
  const t=e.touches;
  if(t.length===2){
    const a=t[0],b=t[1];
    pinchStartDist=touchDist(a,b);
    pinchStartScale=scale;
    const m=touchMid(a,b); pinchMidX=m.x; pinchMidY=m.y;
    gestureMode='pinch';
    touchWasPinch=true;
    e.preventDefault();
    return;
  }
  if(t.length!==1)return;
  startX=lastX=t[0].clientX; startY=lastY=t[0].clientY; startTime=Date.now();
  gestureMode=scale>1?'pan':'swipe';
  e.preventDefault();
}

function touchMove(e){
  const t=e.touches;
  if(t.length===2){
    const a=t[0],b=t[1];
    if(!pinchStartDist){
      pinchStartDist=touchDist(a,b);
      pinchStartScale=scale;
      const m=touchMid(a,b); pinchMidX=m.x; pinchMidY=m.y;
    }
    const d=touchDist(a,b),oldScale=scale;
    scale=Math.max(1,Math.min(2.5,pinchStartScale*d/pinchStartDist));
    const ratio=scale/oldScale;
    panX=pinchMidX-(pinchMidX-panX)*ratio;
    panY=pinchMidY-(pinchMidY-panY)*ratio;
    clamp();apply();
    gestureMode='pinch';touchWasPinch=true;
    e.preventDefault();return;
  }
  if(t.length===1 && gestureMode==='pan' && scale>1 && !touchWasPinch){
    const dx=t[0].clientX-lastX,dy=t[0].clientY-lastY;
    panX+=dx;panY+=dy;lastX=t[0].clientX;lastY=t[0].clientY;
    clamp();apply();e.preventDefault();return;
  }
  e.preventDefault();
}

function touchEnd(e){
  if(touchWasPinch){
    if(e.touches.length===0){
      gestureMode='none';pinchStartDist=0;touchWasPinch=false;
    }
    return;
  }
  if(e.touches.length!==0)return;
  if(gestureMode==='swipe' && scale===1){
    const t=e.changedTouches[0];
    const dx=t.clientX-startX,dy=t.clientY-startY,dt=Math.max(1,Date.now()-startTime);
    const threshold=Math.max(35,Math.min(110,innerWidth*.10));
    if(Math.max(Math.abs(dx),Math.abs(dy))>=threshold && dt<1000){
      if(Math.abs(dx)>=Math.abs(dy))horiz(dx<0?1:-1);
      else vert(dy<0?1:-1);
    }
  }
  gestureMode='none';pinchStartDist=0;
}

stage.addEventListener('touchstart',touchStart,{passive:false});
stage.addEventListener('touchmove',touchMove,{passive:false});
stage.addEventListener('touchend',touchEnd,{passive:false});
stage.addEventListener('touchcancel',()=>{gestureMode='none';pinchStartDist=0;touchWasPinch=false},{passive:false});

// Desktop mouse drag, independent of mobile touch handling.
let mouseDown=false,mouseMode='none',mouseStartX=0,mouseStartY=0,mouseLastX=0,mouseLastY=0,mouseStartTime=0;
stage.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  mouseDown=true;
  mouseStartX=mouseLastX=e.clientX;mouseStartY=mouseLastY=e.clientY;mouseStartTime=Date.now();
  mouseMode=scale>1?'pan':'swipe';e.preventDefault();
});
stage.addEventListener('mousemove',e=>{
  if(!mouseDown)return;
  if(mouseMode==='pan' && scale>1){
    panX+=e.clientX-mouseLastX;panY+=e.clientY-mouseLastY;
    mouseLastX=e.clientX;mouseLastY=e.clientY;
    clamp();apply();e.preventDefault();
  }
});
function mouseEnd(e){
  if(!mouseDown)return;
  mouseDown=false;
  if(mouseMode==='swipe' && scale===1){
    const dx=e.clientX-mouseStartX,dy=e.clientY-mouseStartY,dt=Math.max(1,Date.now()-mouseStartTime);
    const threshold=Math.max(35,Math.min(110,innerWidth*.10));
    if(Math.max(Math.abs(dx),Math.abs(dy))>=threshold && dt<1000){
      if(Math.abs(dx)>=Math.abs(dy))horiz(dx<0?1:-1);
      else vert(dy<0?1:-1);
    }
  }
  mouseMode='none';
}
stage.addEventListener('mouseup',mouseEnd);
stage.addEventListener('mouseleave',e=>{if(mouseDown)mouseEnd(e)});

// Wheel zoom on desktop for testing / accessibility.
stage.addEventListener('wheel',e=>{
  if(!e.ctrlKey)return;
  e.preventDefault();
  const old=scale;
  scale=Math.max(1,Math.min(2.5,scale*(e.deltaY<0?1.12:.89)));
  const ratio=scale/old;
  panX=e.clientX-(e.clientX-panX)*ratio;
  panY=e.clientY-(e.clientY-panY)*ratio;
  clamp();apply();
},{passive:false});

addEventListener('resize',()=>{measure();clamp();apply()});
load(nextFromLayer(order[layerIndex]));
</script></body></html>
