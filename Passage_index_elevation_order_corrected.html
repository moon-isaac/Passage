<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passage</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
#photo{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain;transform-origin:center center;will-change:transform;pointer-events:none}

.arrow{
 position:fixed;z-index:1000;width:56px;height:56px;padding:0;border:0;
 background:transparent;color:rgba(255,255,255,.72);
 display:flex;align-items:center;justify-content:center;cursor:pointer;
 -webkit-tap-highlight-color:transparent;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))
}
.arrow:active{color:rgba(255,255,255,1)}
.arrow svg{width:28px;height:28px}
#left{left:6px;top:50%;transform:translateY(-50%)}
#right{right:6px;top:50%;transform:translateY(-50%)}
#up{top:6px;left:50%;transform:translateX(-50%)}
#down{bottom:6px;left:50%;transform:translateX(-50%)}

#elevation{
 position:fixed;z-index:1001;
 top:max(10px,env(safe-area-inset-top));
 left:max(12px,env(safe-area-inset-left));
 font:400 13px/1 Arial,Helvetica,sans-serif;
 letter-spacing:.01em;color:rgba(255,255,255,.72);
 text-shadow:0 1px 3px rgba(0,0,0,.75);
 pointer-events:none
}

@media(max-width:600px){
 .arrow{width:52px;height:52px}
 .arrow svg{width:25px;height:25px}
 #left{left:6px} #right{right:6px}
 #up{top:max(6px,env(safe-area-inset-top))}
 #down{bottom:max(6px,env(safe-area-inset-bottom))}
 #elevation{font-size:13px}
}
</style>
</head>
<body>

<div id="stage"><img id="photo" alt=""></div>
<div id="elevation"></div>

<button class="arrow" id="left" aria-label="Previous image">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
<path d="M15 4 7 12l8 8"/>
</svg></button>

<button class="arrow" id="right" aria-label="Next image">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
<path d="m9 4 8 8-8 8"/>
</svg></button>

<button class="arrow" id="up" aria-label="Previous elevation">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
<path d="m4 15 8-8 8 8"/>
</svg></button>

<button class="arrow" id="down" aria-label="Next elevation">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
<path d="m4 9 8 8 8-8"/>
</svg></button>

<script>
const layers = {"A": {"elev": "564 m", "files": ["A1.jpg", "A2.jpg", "A3.jpg", "A4.png", "A5.png", "A6.png", "A7.jpg", "A8.jpg"]}, "B": {"elev": "49 m", "files": ["B1.jpg", "B2.jpg", "B3.jpg", "B4.png", "B5.png"]}, "C": {"elev": "29 m", "files": ["C1.jpg", "C2.png", "C3.png", "C4.jpg", "C5.png", "C6.png"]}, "D": {"elev": "28 m", "files": ["D1.jpg", "D2.jpg", "D3.jpg", "D4.jpg", "D5.jpg", "D6.png", "D7.png", "D8.png", "D9.png", "D10.png"]}, "E": {"elev": "4 m", "files": ["E1.jpg", "E2.jpg", "E3.jpg", "E4.jpg", "E5.jpg"]}, "F": {"elev": "1 m", "files": ["F1.jpg", "F2.jpg", "F3.jpg", "F4.jpg", "F5.jpg", "F6.jpg"]}, "G": {"elev": "31 m", "files": ["G1.png", "G2.png", "G3.jpg", "G4.jpg", "G5.jpg", "G6.jpg"]}, "H": {"elev": "-0.05 m", "files": ["H1.jpg", "H2.jpg", "H3.jpg", "H4.jpg", "H5.jpg", "H6.jpg", "H7.jpg", "H8.jpg", "H9.jpg"]}};
const order = ["A", "B", "G", "C", "D", "E", "F", "H"];

const queues = {};
const positions = {};
let layerIndex = 0;
let currentFile = null;

function shuffle(arr) {
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function nextFromLayer(key) {
  if (!queues[key] || positions[key] >= queues[key].length) {
    let q = shuffle(layers[key].files);
    if (q.length > 1 && q[0] === currentFile) {
      [q[0],q[1]]=[q[1],q[0]];
    }
    queues[key]=q;
    positions[key]=0;
  }
  return queues[key][positions[key]++];
}

const photo=document.getElementById('photo');
const elevation=document.getElementById('elevation');

let scale=1, panX=0, panY=0, baseW=0, baseH=0;

function applyTransform() {
  photo.style.transform=`translate3d(${panX}px,${panY}px,0) scale(${scale})`;
}

function resetView() {
  scale=1; panX=0; panY=0; applyTransform();
}

function measureBase() {
  const r=photo.getBoundingClientRect();
  baseW=r.width/scale;
  baseH=r.height/scale;
}

function clampPan() {
  const maxX=Math.max(0,(baseW*scale-innerWidth)/2);
  const maxY=Math.max(0,(baseH*scale-innerHeight)/2);
  panX=Math.max(-maxX,Math.min(maxX,panX));
  panY=Math.max(-maxY,Math.min(maxY,panY));
}

function loadImage(file) {
  currentFile=file;
  resetView();
  photo.onload=()=>{measureBase();resetView();};
  photo.src=file;
  elevation.textContent=layers[order[layerIndex]].elev;
}

function horizontal(dir) {
  const key=order[layerIndex];

  if (dir>0) {
    loadImage(nextFromLayer(key));
  } else {
    const candidates=layers[key].files.filter(f=>f!==currentFile);
    const file=candidates.length
      ? candidates[Math.floor(Math.random()*candidates.length)]
      : layers[key].files[0];
    loadImage(file);
  }
}

function vertical(dir) {
  layerIndex=(layerIndex+dir+order.length)%order.length;
  loadImage(nextFromLayer(order[layerIndex]));
}

document.getElementById('left').onclick=()=>horizontal(-1);
document.getElementById('right').onclick=()=>horizontal(1);
document.getElementById('up').onclick=()=>vertical(-1);
document.getElementById('down').onclick=()=>vertical(1);

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') horizontal(-1);
  else if(e.key==='ArrowRight') horizontal(1);
  else if(e.key==='ArrowUp') vertical(-1);
  else if(e.key==='ArrowDown') vertical(1);
});

// Smartphone: two-finger pinch zoom.
// When zoomed, one finger pans the image.
// At 1x, image navigation is controlled only by the fixed arrows.
let touches=new Map();
let pinchDistance=0;
let pinchStartScale=1;
let lastX=0,lastY=0;

function distance(a,b){
  return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
}

document.addEventListener('touchstart',e=>{
  for(const t of e.changedTouches) touches.set(t.identifier,t);

  if(touches.size===2){
    const [a,b]=[...touches.values()];
    pinchDistance=distance(a,b);
    pinchStartScale=scale;
  }else if(touches.size===1 && scale>1){
    const t=[...touches.values()][0];
    lastX=t.clientX; lastY=t.clientY;
  }
},{passive:false});

document.addEventListener('touchmove',e=>{
  for(const t of e.changedTouches) touches.set(t.identifier,t);

  if(touches.size===2){
    e.preventDefault();
    const [a,b]=[...touches.values()];
    const d=distance(a,b);

    if(pinchDistance>0){
      scale=Math.max(1,Math.min(5,pinchStartScale*d/pinchDistance));
      clampPan();
      applyTransform();
    }
  }else if(touches.size===1 && scale>1){
    e.preventDefault();
    const t=[...touches.values()][0];
    panX+=t.clientX-lastX;
    panY+=t.clientY-lastY;
    lastX=t.clientX; lastY=t.clientY;
    clampPan();
    applyTransform();
  }
},{passive:false});

document.addEventListener('touchend',e=>{
  for(const t of e.changedTouches) touches.delete(t.identifier);
  if(touches.size<2) pinchDistance=0;
},{passive:false});

document.addEventListener('touchcancel',e=>{
  for(const t of e.changedTouches) touches.delete(t.identifier);
  if(touches.size<2) pinchDistance=0;
},{passive:false});

window.addEventListener('resize',()=>{
  measureBase();
  clampPan();
  applyTransform();
});

// Start with a random image in the highest layer.
loadImage(nextFromLayer(order[layerIndex]));
</script>
</body>
</html>
